[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brush-gpt"
version = "0.1.0"
description = "A transformer that paints cat portraits stroke by stroke, trained on paintings made by a stroke-fitting painter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10.0",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "torch>=2.2",
]

[project.optional-dependencies]
plan = ["transformers>=4.40"]      # Segment Anything, for the sketch plan

[tool.setuptools.packages.find]
include = ["brushgpt*"]

[tool.setuptools.package-data]
brushgpt = ["data/*.npy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# On Linux (including CI) install the CPU build of torch: the default Linux wheel
# pulls several gigabytes of CUDA libraries that a machine without a GPU never uses.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0 ; python_full_version >= '3.11'",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
