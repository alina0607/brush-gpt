[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brush-gpt"
version = "0.1.0"
description = "A transformer that paints cat portraits stroke by stroke, trained on paintings made by a stroke-fitting painter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pillow>=10.0",
    "scikit-image>=0.22",
    "scipy>=1.11",
    "torch>=2.2",
]

[project.optional-dependencies]
plan = ["transformers>=4.40"]      # Segment Anything, for the sketch plan
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["brushgpt*"]

[tool.setuptools.package-data]
brushgpt = ["data/*.npy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
